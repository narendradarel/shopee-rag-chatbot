<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <title>Chatbot Produk Shopee</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/chat-web.js" defer></script>
</head>

<body>

    <main class="app">

        <header class="header">
            <div class="logo" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M4 5h16v12H9l-5 4V5z" />
                    <path d="M8 10h8M8 13h5" />
                </svg>
            </div>

            <div>
                <h1>Chatbot Produk Shopee</h1>
                <p class="status" id="apiStatus" role="status">
                    Memeriksa koneksi...
                </p>
            </div>
        </header>

        <section class="chat-area" id="chatBox" role="log" aria-label="Percakapan chatbot" aria-live="polite">
            <div class="welcome" id="welcome">
                <div class="welcome-icon" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round">
                        <rect x="4" y="7" width="16" height="13" rx="2" />
                        <path d="M12 3v4M8 12h.01M16 12h.01M9 16h6" />
                    </svg>
                </div>
                <h2>Ada yang ingin ditanyakan?</h2>
                <p>
                    Cari informasi produk, harga, dan deskripsi
                    berdasarkan katalog Shopee.
                </p>
            </div>
        </section>

        <form id="chatForm" class="composer">
            <div class="input-group">
                <label for="chatInput" class="sr-only">
                    Pertanyaan produk
                </label>

                <textarea id="chatInput" placeholder="Tanyakan sesuatu tentang produk..." rows="1" maxlength="1200"
                    required></textarea>

                <button type="submit" id="sendBtn" aria-label="Kirim pesan" title="Kirim pesan">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <path d="M5 12 19 5l-4 14-3-6-7-1z" />
                        <path d="m12 13 7-8" />
                    </svg>
                </button>
            </div>

            <p class="input-note">
                Jawaban berdasarkan data katalog Shopee
            </p>
        </form>

    </main>

</body>

</html>
