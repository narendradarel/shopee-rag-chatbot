<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Samsung Shopee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .catalog {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 24px;
        }

        .catalog h2 {
            font-size: 19px;
            margin: 0 0 8px;
        }

        #status {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #f4f4f4;
            color: #333;
            text-align: left;
            font-weight: 600;
        }

        th,
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #e5e5e5;
            vertical-align: top;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .price {
            color: #ee4d2d;
            font-weight: 700;
            white-space: nowrap;
        }

        .shopee-link {
            color: #0066ff;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .shopee-link:hover {
            text-decoration: underline;
        }

        .whatsapp-section {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 24px;
            margin-top: 20px;
        }

        .whatsapp-section h2 {
            font-size: 19px;
            margin: 0 0 8px;
        }

        .whatsapp-section p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .wa-button {
            display: inline-block;
            background: #168d49;
            color: white;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
        }

        .wa-button:hover {
            background: #11743b;
        }

        @media (max-width: 600px) {
            .container {
                margin: 16px auto;
                padding: 0 12px;
            }

            .header,
            .catalog,
            .whatsapp-section {
                padding: 18px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="header">
            <h1>Samsung Official Shop</h1>
            <p class="subtitle">
                Katalog Produk Samsung dari Shopee
            </p>
        </header>

        <section class="catalog">
            <h2>Daftar Produk</h2>
            <p id="status" role="status">
                Memuat katalog...
            </p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Link Shopee</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody">
                        <tr>
                            <td colspan="5">Memuat data produk...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="whatsapp-section">
            <h2>Butuh Bantuan?</h2>
            <p>
                Tanyakan informasi produk melalui
                chatbot WhatsApp kami.
            </p>

            <a class="wa-button"
                href="https://api.whatsapp.com/send?phone=628113116882&amp;text=Halo%2C%20saya%20ingin%20bertanya%20tentang%20produk%20Samsung"
                target="_blank" rel="noopener noreferrer">
                Chat via WhatsApp
            </a>
        </section>

    </main>

    <script>
        const CSV_URL = "/data/products.csv";

        const tbody = document.getElementById("productsBody");
        const status = document.getElementById("status");

        // Membaca CSV dengan dukungan tanda kutip,
        // koma dalam nama produk, dan pemisah titik koma.
        function parseCSV(text) {
            text = text.replace(/^\uFEFF/, "");

            const firstLine = text.split(/\r?\n/, 1)[0];
            const delimiter =
                (firstLine.match(/;/g) || []).length >
                    (firstLine.match(/,/g) || []).length
                    ? ";" : ",";

            const rows = [];
            let row = [];
            let cell = "";
            let quoted = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];

                if (c === '"') {
                    if (quoted && text[i + 1] === '"') {
                        cell += '"';
                        i++;
                    } else {
                        quoted = !quoted;
                    }
                } else if (c === delimiter && !quoted) {
                    row.push(cell);
                    cell = "";
                } else if ((c === "\n" || c === "\r") && !quoted) {
                    if (c === "\r" && text[i + 1] === "\n") i++;
                    row.push(cell);
                    if (row.some(x => x.trim())) rows.push(row);
                    row = [];
                    cell = "";
                } else {
                    cell += c;
                }
            }

            row.push(cell);
            if (row.some(x => x.trim())) rows.push(row);

            if (rows.length < 2) return [];

            const headers = rows.shift().map(
                h => h.trim().toLowerCase()
            );

            return rows.map(values => {
                const obj = {};
                headers.forEach((header, i) => {
                    obj[header] = (values[i] || "").trim();
                });
                return obj;
            });
        }

        function getField(product, names) {
            for (const name of names) {
                if (product[name]) return product[name];
            }
            return "";
        }

        function formatPrice(price) {
            if (!price) return "-";

            if (/^\d+$/.test(price)) {
                return new Intl.NumberFormat("id-ID", {
                    style: "currency",
                    currency: "IDR",
                    maximumFractionDigits: 0
                }).format(Number(price));
            }

            return price;
        }

        function validShopeeLink(value) {
            try {
                const url = new URL(value);
                const host = url.hostname.toLowerCase();

                if (
                    url.protocol === "https:" &&
                    (host === "shopee.co.id" ||
                        host.endsWith(".shopee.co.id"))
                ) {
                    return url.href;
                }
            } catch { }

            return "";
        }

        function addCell(tr, text, className = "") {
            const td = document.createElement("td");
            td.textContent = text;
            if (className) td.className = className;
            tr.appendChild(td);
            return td;
        }

        async function loadProducts() {
            try {
                const response = await fetch(CSV_URL, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Gagal mengambil ${CSV_URL} (${response.status})`);
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                const products = rows.map(row => {
                    const nama = getField(row, [
                        "whitespace-normal",
                        "nama",
                        "nama_produk",
                        "name",
                        "title"
                    ]);

                    let kategori = "Lainnya";
                    const n = nama.toLowerCase();

                    if (n.includes("galaxy tab")) kategori = "Tablet";
                    else if (n.includes("galaxy watch")) kategori = "Smartwatch";
                    else if (n.includes("galaxy buds")) kategori = "Earbuds";
                    else if (n.includes("galaxy") && n.includes("case")) kategori = "Aksesoris";
                    else if (n.includes("galaxy")) kategori = "Smartphone";
                    else if (n.includes("tv")) kategori = "Televisi";
                    else if (n.includes("kulkas")) kategori = "Kulkas";
                    else if (n.includes("mesin cuci")) kategori = "Mesin Cuci";
                    else if (/\bac\b/i.test(nama)) kategori = "AC";
                    else if (n.includes("soundbar")) kategori = "Audio";

                    return {
                        nama,
                        kategori,
                        harga: getField(row, [
                            "font-medium 2",
                            "harga",
                            "price"
                        ]),
                        link: getField(row, [
                            "contents href",
                            "link",
                            "link_shopee",
                            "url"
                        ])
                    };
                }).filter(p => p.nama);

                if (!products.length) {
                    throw new Error(
                        "Kolom nama produk tidak cocok. " +
                        "Periksa header pada products.csv."
                    );
                }

                tbody.replaceChildren();

                products.forEach((product, index) => {
                    const tr = document.createElement("tr");

                    addCell(tr, String(index + 1));
                    addCell(tr, product.nama);
                    addCell(tr, product.kategori || "-");
                    addCell(tr, formatPrice(product.harga), "price");

                    const linkCell = addCell(tr, "");
                    const url = validShopeeLink(product.link);

                    if (url) {
                        const a = document.createElement("a");
                        a.href = url;
                        a.textContent = "Lihat Produk";
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                        a.className = "shopee-link";
                        linkCell.appendChild(a);
                    } else {
                        linkCell.textContent = "-";
                    }

                    tbody.appendChild(tr);
                });

                status.textContent =
                    `${products.length} produk berhasil dimuat`;

            } catch (error) {
                console.error("Gagal memuat katalog:", error);

                status.textContent =
                    "Gagal memuat katalog: " + error.message;

                tbody.replaceChildren();
                const tr = document.createElement("tr");
                addCell(tr, "Data katalog tidak tersedia.")
                    .colSpan = 5;
                tbody.appendChild(tr);
            }
        }

        loadProducts();
    </script>
</body>

</html>
