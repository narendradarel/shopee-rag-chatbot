<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Samsung Shopee</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main class="container">

        <header class="header">
            <h1>Samsung Official Shop</h1>
            <p class="subtitle">
                Katalog Produk Samsung dari Shopee
            </p>
        </header>

        <section class="catalog">
            <h2>Daftar Produk</h2>
            <p id="status" role="status">
                Memuat katalog...
            </p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Link Shopee</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody">
                        <tr>
                            <td colspan="5">Memuat data produk...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="whatsapp-section">
            <h2>Butuh Bantuan?</h2>
            <p>
                Tanyakan informasi produk melalui
                chatbot WhatsApp kami.
            </p>

            <a class="wa-button"
                href="https://api.whatsapp.com/send?phone=628113116882&amp;text=Halo%2C%20saya%20ingin%20bertanya%20tentang%20produk%20Samsung"
                target="_blank" rel="noopener noreferrer">
                Chat via WhatsApp
            </a>
        </section>

    </main>

    <script src="./app.js" defer></script>
</body>

</html>
